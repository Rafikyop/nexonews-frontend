<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Acceso administrativo de NexoNews." />

    <title>NexoNews | Administrador</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>

  <body>
    <main class="admin-login-page">
      <div class="admin-login-header container">
        <a href="index.html" class="navbar__brand">
          <span class="navbar__logo"> N </span>

          <span class="navbar__name"> Nexo<span>News</span> </span>
        </a>

        <a href="index.html" class="text-link"> ← Volver al inicio </a>
      </div>

      <section class="admin-login-content">
        <div class="admin-login-wrapper">
          <div class="admin-login-intro">
            <span class="admin-badge"> Acceso administrador </span>

            <h1>Acceso de administrador</h1>

            <p>
              Ingresa tus credenciales para gestionar las noticias de NexoNews.
            </p>
          </div>

          <form id="admin-login-form" class="admin-login-card" novalidate>
            <div class="admin-demo-info">
              <strong> Credenciales de demostración </strong>

              <span> admin@nexonews.com </span>

              <span> Contraseña: nexo2026 </span>
            </div>

            <div class="form-group">
              <label for="admin-email"> Correo electrónico </label>

              <input
                id="admin-email"
                type="email"
                placeholder="admin@nexonews.com"
              />

              <small id="admin-email-error" class="form-error"></small>
            </div>

            <div class="form-group">
              <label for="admin-password"> Contraseña </label>

              <input
                id="admin-password"
                type="password"
                placeholder="Ingresa tu contraseña"
              />

              <small id="admin-password-error" class="form-error"></small>
            </div>

            <div id="admin-login-error" class="admin-login-error hidden">
              Correo o contraseña incorrectos.
            </div>

            <button type="submit" class="button button--primary form-submit">
              Iniciar sesión
            </button>
          </form>
        </div>
      </section>
    </main>

    <script src="js/services/auth.service.js"></script>
    <script src="js/pages/admin.js"></script>
  </body>
</html>
