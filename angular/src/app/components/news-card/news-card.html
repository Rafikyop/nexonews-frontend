<article class="news-card" [attr.data-id]="noticia.id">
  <div class="news-card__image-wrapper">
    <img [src]="noticia.imagen" [alt]="noticia.titulo" class="news-card__image" />

    <button class="news-card__favorite" type="button" aria-label="Agregar a favoritos">♡</button>
  </div>

  <div class="news-card__content">
    <span class="category-badge" [class]="'category-badge ' + obtenerClaseCategoria()">
      {{ noticia.categoria }}
    </span>

    <h2 class="news-card__title">
      <a [routerLink]="['/noticia', noticia.id]">
        {{ noticia.titulo }}
      </a>
    </h2>

    <p class="news-card__description">
      {{ noticia.descripcion }}
    </p>

    <div class="news-card__meta">
      <span>
        {{ noticia.autor }}
      </span>

      <span>
        {{ noticia.fecha | date: 'd MMM yyyy' }}
      </span>
    </div>

    <a [routerLink]="['/noticia', noticia.id]" class="news-card__read-more">
      Leer noticia completa →
    </a>
  </div>
</article>
