<section class="section">
  <div class="container">
    <div class="admin-login-wrapper">
      <div class="admin-login-intro">
        <span class="admin-badge"> Acceso administrador </span>

        <h1>Acceso de administrador</h1>

        <p>Ingresa tus credenciales para gestionar las noticias de NexoNews.</p>
      </div>

      <form class="admin-login-card" [formGroup]="formulario" (ngSubmit)="iniciarSesion()">
        <div class="admin-demo-info">
          <strong> Credenciales de demostración </strong>

          <span> admin@nexonews.com </span>

          <span> Contraseña: nexo2026 </span>
        </div>

        <div class="form-group">
          <label for="email"> Correo electrónico </label>

          <input id="email" type="email" formControlName="email" />
        </div>

        <div class="form-group">
          <label for="password"> Contraseña </label>

          <input id="password" type="password" formControlName="password" />
        </div>

        @if (errorLogin()) {
          <div class="admin-login-error">Correo o contraseña incorrectos.</div>
        }

        <button type="submit" class="button button--primary form-submit">Iniciar sesión</button>
      </form>
    </div>
  </div>
</section>
