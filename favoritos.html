<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Noticias favoritas guardadas en NexoNews."
    />

    <title>NexoNews | Favoritos</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <main>
      <section class="page-header">
        <div class="container">
          <span class="page-header__eyebrow"> NexoNews · Tu colección </span>

          <h1 class="page-header__title">Mis noticias favoritas</h1>

          <p class="page-header__description">
            Consulta las noticias que has guardado para leer más tarde.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div id="favorites-list" class="news-grid"></div>

          <div id="favorites-empty" class="empty-state hidden">
            <h2>Aún no tienes noticias favoritas</h2>

            <p>Explora las noticias y guarda las que más te interesen.</p>

            <a href="noticias.html" class="button button--primary">
              Explorar noticias
            </a>
          </div>
        </div>
      </section>
    </main>

    <div id="footer"></div>

    <!-- Componentes compartidos -->
    <script src="js/components/navbar.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/components/news-card.js"></script>

    <!-- Servicios -->
    <script src="js/services/auth.service.js"></script>
    <script src="js/services/noticias.service.js"></script>
    <script src="js/services/storage.service.js"></script>

    <!-- Página Home -->
    <script src="js/pages/home.js"></script>

    <!-- Configuración general -->
    <script src="js/app.js"></script>
  </body>
</html>
