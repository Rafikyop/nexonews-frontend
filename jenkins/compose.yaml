services:
  jenkins:
    build:
      context: .
    container_name: nexonews-jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - jenkins_home:/var/jenkins_home
    depends_on:
      - docker
    networks:
      - jenkins-network
      - docker-internal

  docker:
    image: docker:27.5.1-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - dockerd
      - --host=tcp://0.0.0.0:2375
      - --tls=false
    volumes:
      - docker_data:/var/lib/docker
    networks:
      - docker-internal

volumes:
  jenkins_home:
  docker_data:

networks:
  jenkins-network:
    driver: bridge

  docker-internal:
    driver: bridge
