<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Explora todas las noticias de NexoNews."
    />

    <title>NexoNews | Noticias</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <main>
      <!-- ENCABEZADO -->
      <section class="page-header">
        <div class="container">
          <span class="page-header__eyebrow"> NexoNews </span>

          <h1 class="page-header__title">Explora nuestras noticias</h1>

          <p class="page-header__description">
            Encuentra información de tecnología, educación, turismo y negocios.
          </p>
        </div>
      </section>

      <!-- CONTENIDO -->
      <section class="section">
        <div class="container">
          <!-- FILTROS -->
          <div class="news-toolbar">
            <div class="news-filters">
              <button class="filter-button active" data-category="Todas">
                Todas
              </button>

              <button class="filter-button" data-category="Tecnología">
                Tecnología
              </button>

              <button class="filter-button" data-category="Educación">
                Educación
              </button>

              <button class="filter-button" data-category="Turismo">
                Turismo
              </button>

              <button class="filter-button" data-category="Negocios">
                Negocios
              </button>
            </div>

            <div class="news-search">
              <input
                type="search"
                id="news-search"
                placeholder="Buscar noticias..."
              />
            </div>
          </div>

          <!-- RESULTADOS -->
          <div class="news-results-info">
            <span id="news-count"> Cargando noticias... </span>
          </div>

          <!-- LISTADO DINÁMICO -->
          <div id="news-list" class="news-grid"></div>

          <!-- ESTADO VACÍO -->
          <div id="news-empty" class="empty-state hidden">
            <h2>No encontramos noticias</h2>

            <p>Intenta cambiar la categoría o el texto de búsqueda.</p>
          </div>
        </div>
      </section>
    </main>

    <div id="footer"></div>

    <!-- Componentes compartidos -->
    <script src="js/components/navbar.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/components/news-card.js"></script>

    <!-- Servicios -->
    <script src="js/services/auth.service.js"></script>
    <script src="js/services/noticias.service.js"></script>
    <script src="js/services/storage.service.js"></script>

    <!-- Página Home -->
    <script src="js/pages/noticias.js"></script>

    <!-- Configuración general -->
    <script src="js/app.js"></script>
  </body>
</html>
